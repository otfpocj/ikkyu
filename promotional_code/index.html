<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกรหัสประชาสัมพันธ์</title>
    <script>
        // ตรวจสอบสถานะการเข้าสู่ระบบ
        if (sessionStorage.getItem("isLoggedIn") !== "true") {
            alert("กรุณาเข้าสู่ระบบก่อนใช้งานระบบนี้ครับ");
            // พาดีดกลับไปที่หน้าแรกของเว็บคุณโดยตรง ป้องกันลิงก์พัง
            window.location.href = "/ikkyu/index.html"; 
        }
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        #app-frame-container {
            width: 100%;
            height: 100vh;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="app-frame-container"></div>

    <script>
    
        const encodedUrl = "aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFg="; // <-- ใส่รหัส Base64 ของคุณตรงนี้

        const decodedUrl = atob(encodedUrl);

        const container = document.getElementById('app-frame-container');
        const iframe = document.createElement('iframe');
        iframe.src = decodedUrl;
        iframe.allow = "geolocation; microphone; camera";
        
        container.appendChild(iframe);
    </script>
</body>
</html>
