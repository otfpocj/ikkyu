<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - บริการน้องอิคคิว</title>
    <!-- AdminLTE & FontAwesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="hold-transition login-page" style="background-color: #e9ecef;">
<div class="login-box">
  <div class="card card-outline card-primary">
    <div class="card-header text-center">
      <h1 class="h3"><b>บริการน้องอิคคิว</b></h1>
      <small>ชตินนท์ จากรัมย์</small>
    </div>
    <div class="card-body">
      <p class="login-box-msg">กรุณาเข้าสู่ระบบเพื่อใช้งาน Dashboard</p>

      <form id="loginForm">
        <div class="input-group mb-3">
          <input type="text" id="username" class="form-control" placeholder="ชื่อผู้ใช้งาน" required>
          <div class="input-group-append">
            <div class="input-group-text"><span class="fas fa-user"></span></div>
          </div>
        </div>
        <div class="input-group mb-3">
          <input type="password" id="password" class="form-control" placeholder="รหัสผ่าน" required>
          <div class="input-group-append">
            <div class="input-group-text"><span class="fas fa-lock"></span></div>
          </div>
        </div>
        <div class="row">
          <div class="col-12">
            <button type="submit" id="btnSubmit" class="btn btn-primary btn-block">เข้าสู่ระบบ</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
    const encodedGasUrl = "aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J4NEFsYTVMU1JKNWF3SFd6eWRpM0NrMENDRnlhdTNrX0NkeHpSMFpvSDMwcE9sLUxCelAyZm8yUG9yOWpqUlBodzMvZXhlYw=="; 

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerText = "กำลังตรวจสอบ...";

        const payload = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        try {
            // ถอดรหัส URL แบบไดนามิกเพื่อเรียกใช้งาน API
            const gasUrl = atob(encodedGasUrl);
            
            const res = await fetch(gasUrl, {
                method: "POST",
                body: JSON.stringify(payload)
            });
            const result = await res.json();

            if(result.status === "success") {
                sessionStorage.setItem("isLoggedIn", "true");
                sessionStorage.setItem("fullname", result.fullname);
                window.location.href = "dashboard.html";
            } else {
                alert(result.message);
                btn.disabled = false;
                btn.innerText = "เข้าสู่ระบบ";
            }
        } catch(err) {
            alert("เกิดข้อผิดพลาดในการเชื่อมต่อระบบ");
            btn.disabled = false;
            btn.innerText = "เข้าสู่ระบบ";
        }
    });
</script>
</body>
</html>
