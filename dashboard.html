<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - บริการน้องอิคคิว</title>
    <!-- AdminLTE & FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // ตรวจสอบสิทธิ์การ Login
        if (sessionStorage.getItem("isLoggedIn") !== "true") {
            window.location.href = "index.html";
        }
    </script>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <!-- Navbar -->
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <a href="dashboard.html" class="nav-link">หน้าแรก</a>
      </li>
    </ul>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item">
        <button onclick="logout()" class="btn btn-outline-danger btn-sm">ออกจากระบบ</button>
      </li>
    </ul>
  </nav>

  <!-- Sidebar -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="#" class="brand-link">
      <span class="brand-text font-weight-light">บริการน้องอิคคิว</span>
    </a>
    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="info">
          <a href="#" class="d-block" id="userDisplayName">ผู้ใช้งานระบบ</a>
        </div>
      </div>
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
          <li class="nav-item">
            <a href="dashboard.html" class="nav-link active">
              <i class="nav-icon fas fa-tachometer-alt"></i>
              <p>แดชบอร์ด</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="promotional_code/index.html" target="_blank" class="nav-link">
              <i class="nav-icon fas fa-pen-to-square"></i>
              <p>บันทึกรหัสประชาสัมพันธ์</p>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="content-wrapper">
    <section class="content-header">
      <div class="container-fluid">
        <h1>แผงควบคุม (Dashboard)</h1>
      </div>
    </section>

    <section class="content">
      <div class="container-fluid">
        <div class="row">
          <div class="col-lg-4 col-6">
            <div class="small-box bg-success">
              <div class="inner">
                <h3>บันทึกรหัส</h3>
                <p>ระบบบันทึกรหัสประชาสัมพันธ์</p>
              </div>
              <div class="icon">
                <i class="fas fa-file-pen"></i>
              </div>
              <a href="promotional_code/index.html" target="_blank" class="small-box-footer">
                เปิดระบบบันทึกในแท็บใหม่ <i class="fas fa-arrow-circle-right"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Footer -->
  <footer class="main-footer">
    <strong>Copyright &copy; 2026 บริการน้องอิคคิว - ชตินนท์ จากรัมย์.</strong> All rights reserved.
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<script>
    document.getElementById('userDisplayName').innerText = sessionStorage.getItem("fullname") || "ผู้ใช้งาน";

    function logout() {
        sessionStorage.clear();
        window.location.href = "index.html";
    }
</script>
</body>
</html>
